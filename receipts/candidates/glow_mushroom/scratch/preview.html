<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>preview</title>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
<style>body{margin:0;background:#22262b}canvas{display:block}</style>
</head>
<body>
<script type="module">
// Scratch preview: one row per module, extra angles the verifier does not take.
// Views: eye level from the front (elev 8 deg), eye level from the back-left,
// from below (elev -35 deg), and the three-quarter view under dim forest shade
// light with a warm shaft, to judge how the gills glow.
import * as THREE from 'three';
const q = new URLSearchParams(location.search);
const srcs = q.get('src').split(',');
const size = +(q.get('size') || 360);
const VIEWS = [
  { az: 0, el: 8, light: 'sheet' },
  { az: 225, el: 8, light: 'sheet' },
  { az: 30, el: -35, light: 'sheet' },
  { az: 45, el: 20, light: 'shade' },
  { az: 200, el: 12, light: 'shade' },
];
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(size * VIEWS.length, size * srcs.length, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const H = renderer.domElement.height;

const sheet = new THREE.Scene();
sheet.background = new THREE.Color(0x22262b);
sheet.add(new THREE.HemisphereLight(0xffffff, 0x556677, 2.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.9); sun.position.set(5, 9, 7); sheet.add(sun);
const shade = new THREE.Scene();
shade.background = new THREE.Color(0x10160f);
shade.add(new THREE.HemisphereLight(0x5a7a58, 0x1a140e, 0.55));
const shaft = new THREE.DirectionalLight(0xffd79a, 0.9); shaft.position.set(-3, 9, 2); shade.add(shaft);

let row = 0;
for (const src of srcs) {
  const mod = await import(src);
  const make = () => mod.default(THREE);
  const a = make(), b = make();
  sheet.add(a); shade.add(b);
  const box = new THREE.Box3().setFromObject(a);
  const dim = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
  const radius = 0.5 * Math.hypot(dim.x, dim.y, dim.z);
  const dist = (radius / Math.sin((17 * Math.PI) / 180)) * 1.05;
  VIEWS.forEach((v, i) => {
    const az = (v.az * Math.PI) / 180, el = (v.el * Math.PI) / 180;
    const cam = new THREE.PerspectiveCamera(34, 1, dist * 0.01, dist * 10);
    cam.position.set(ctr.x + Math.sin(az) * dist * Math.cos(el), ctr.y + dist * Math.sin(el), ctr.z + Math.cos(az) * dist * Math.cos(el));
    cam.lookAt(ctr);
    renderer.setViewport(i * size, H - (row + 1) * size, size, size);
    renderer.setScissor(i * size, H - (row + 1) * size, size, size);
    renderer.setScissorTest(true);
    renderer.render(v.light === 'shade' ? shade : sheet, cam);
  });
  sheet.remove(a); shade.remove(b);
  row++;
}
window.__DONE__ = true;
</script>
</body>
</html>
