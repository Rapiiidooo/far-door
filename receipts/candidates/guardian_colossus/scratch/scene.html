<!doctype html>
<html><head><meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "/game/vendor/three.module.js", "three/addons/": "/game/vendor/" } }</script>
<style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<script type="module">
// Throwaway game-like view: low sun with shadows, haze, a 1.75 m hero for scale,
// loaded through the game's own assetlib with surfaces on.
import * as THREE from 'three';
import { ASSET } from '/game/assetlib.js';
const q = new URLSearchParams(location.search);
const src = q.get('src');
const W = +(q.get('w') || 800), H = +(q.get('h') || 450);
const sunAz = +(q.get('az') || 35) * Math.PI / 180, sunEl = +(q.get('el') || 15) * Math.PI / 180;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
const single = q.get('single') === '1';
renderer.setSize(single ? W : W * 2, single ? H : H * 2, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const HAZE = 0xe6c9a2;
scene.background = new THREE.Color(HAZE);
scene.fog = new THREE.Fog(HAZE, 45, 260);
scene.add(new THREE.HemisphereLight(0xfff1dc, 0x8a6446, 0.9));
const sun = new THREE.DirectionalLight(0xffd6a0, 3.2);
sun.position.set(-Math.sin(sunAz) * Math.cos(sunEl), Math.sin(sunEl), Math.cos(sunAz) * Math.cos(sunEl)).multiplyScalar(60);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 160 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshStandardMaterial({ color: 0xc49a68, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const hero = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 1.15, 4, 12), new THREE.MeshStandardMaterial({ color: 0x2d3656, roughness: 0.8 }));
hero.position.set(999, 0, 999);
hero.castShadow = true;
scene.add(hero);
let info = { ok: false };
try {
  // read-only composite: other agents' assets are loaded, never written
  const place = [
    ['/game/assets/guardian_colossus.js', 0, 0, 0],
    ['/game/assets/hero_explorer.js', 5.2, 0, 7.2, true],
    ['/game/assets/broken_column.js', -7.5, 0, 6.5],
    ['/game/assets/broken_column.js', 8.5, 0, 3.0, false, 1.2],
    ['/game/assets/glyph_stela.js', -4.5, 0, 9.5],
    ['/game/assets/far_gate.js', 0, 0, -22, false, Math.PI],
  ];
  for (const [src, x, y, z, rig, ry] of place) {
    const o = await ASSET(src, { surfaces: true, keepHierarchy: !!rig });
    o.position.set(x, y, z);
    if (ry) o.rotation.y = ry;
    o.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
    scene.add(o);
  }
  const views = JSON.parse(q.get('views'));
  views.forEach(([d, azDeg, camH, lookY], i) => {
    const a = azDeg * Math.PI / 180;
    const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 50), W / H, 0.3, 600);
    cam.position.set(Math.sin(a) * d, camH, Math.cos(a) * d);
    cam.lookAt(0, lookY, 0);
    const col = i % 2, row = Math.floor(i / 2);
    renderer.setViewport(col * W, (1 - row) * H, W, H);
    renderer.setScissor(col * W, (1 - row) * H, W, H);
    renderer.setScissorTest(true);
    renderer.render(scene, cam);
  });
  info = { ok: true };
} catch (e) { info = { ok: false, error: String(e && e.message || e) }; }
window.__INFO__ = info;
window.__DONE__ = true;
</script></body></html>
