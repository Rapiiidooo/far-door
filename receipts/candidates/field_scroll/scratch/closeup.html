<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js" } }
</script>
<style>body{margin:0;background:#22262b}canvas{display:block}</style>
</head>
<body>
<script type="module">
// Close-up views of one candidate with the game's three.js, under the verifier's light.
// ?src=<module url>&size=<px>&views=<name:azimuthDeg:elevDeg:zoom:tx:ty:tz,...>
import * as THREE from 'three';
const q = new URLSearchParams(location.search);
const size = +(q.get('size') || 600);
const views = (q.get('views') || 'q:45:35:1:0:0:0').split(',').map((s) => {
  const [name, az, el, zoom, tx, ty, tz] = s.split(':');
  return { name, az: +az, el: +el, zoom: +zoom, t: [+tx || 0, +ty || 0, +tz || 0] };
});
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(size * views.length, size, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x22262b);
scene.add(new THREE.HemisphereLight(0xffffff, 0x556677, 2.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.9);
sun.position.set(5, 9, 7);
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.MeshStandardMaterial({ color: 0x6b5a48, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
if (q.get('ground') === '1') scene.add(ground);
const mod = await import(q.get('src'));
const obj = mod.default(THREE);
scene.add(obj);
const box = new THREE.Box3().setFromObject(obj), ctr = box.getCenter(new THREE.Vector3()), dim = box.getSize(new THREE.Vector3());
const radius = 0.5 * Math.hypot(dim.x, dim.y, dim.z);
views.forEach((v, i) => {
  const dist = (radius / Math.sin((17 * Math.PI) / 180)) * 1.05 / v.zoom;
  const target = ctr.clone().add(new THREE.Vector3(...v.t));
  const a = (v.az * Math.PI) / 180, e = (v.el * Math.PI) / 180;
  const cam = new THREE.PerspectiveCamera(34, 1, 0.005, 50);
  cam.position.set(target.x + Math.sin(a) * dist * Math.cos(e), target.y + dist * Math.sin(e), target.z + Math.cos(a) * dist * Math.cos(e));
  cam.lookAt(target);
  renderer.setViewport(i * size, 0, size, size);
  renderer.setScissor(i * size, 0, size, size);
  renderer.setScissorTest(true);
  renderer.render(scene, cam);
});
window.__DONE__ = true;
</script>
</body>
</html>
