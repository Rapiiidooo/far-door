<!doctype html>
<html><head><meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "/game/vendor/three.module.js", "three/addons/": "/game/vendor/" } }</script>
<style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<script type="module">
// Throwaway: fern candidates in the game's own forest (game/forest.js) or lined up on its
// floor under its light, loaded through the game's assetlib with surfaces on.
import * as THREE from 'three';
import { ASSET } from '/game/assetlib.js';
import { ForestView } from '/game/forest.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1280), H = +(q.get('h') || 720);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = +(q.get('exp') || 0.86);
document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(50, W / H, 0.05, 900);
let info = { ok: false };
try {
  const exists = async (url) => { try { return (await fetch(url, { method: 'HEAD' })).ok; } catch { return false; } };
  const mode = q.get('mode') || 'lineup';
  let scene;
  if (mode === 'forest') {
    const src = q.get('src');
    const assets = { async make(name, opts = {}) {
      const url = name === 'fern_cluster' ? src : `/game/assets/${name}.js`;
      if (!(await exists(url))) return null;
      return ASSET(url, { surfaces: true, ...opts });
    } };
    const f = new ForestView(assets);
    await f.build();
    scene = f.scene;
  } else {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xa7bd86);
    scene.fog = new THREE.FogExp2(0x93ad74, 0.02);
    const sun = new THREE.DirectionalLight(0xffe2a0, 2.4);
    sun.position.set(+(q.get('sx') || -18), 40, +(q.get('sz') || -30));
    scene.add(sun, sun.target);
    scene.add(new THREE.HemisphereLight(0xd8eab0, 0x2f3d1c, 1.5));
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80).rotateX(-Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: 0x4a6b33, roughness: 0.95 }));
    scene.add(ground);
    const srcs = (q.get('srcs') || '').split(',').filter(Boolean);
    const xs = (q.get('xs') || '-1.6,0,1.6').split(',').map(Number);
    const yaw = +(q.get('yaw') || 0);
    for (let i = 0; i < srcs.length; i++) {
      const o = await ASSET(srcs[i], { surfaces: q.get('surf') !== '0' });
      o.position.set(xs[i], 0, 0);
      o.rotation.y = yaw;
      scene.add(o);
    }
    if (q.get('hero') !== '0') {
      const hero = await ASSET('/game/assets/hero_explorer.js', { surfaces: false, keepHierarchy: true });
      hero.position.set(+(q.get('hx') || 3), 0, 0.3);
      hero.rotation.y = -0.5;
      scene.add(hero);
    }
  }
  const views = JSON.parse(q.get('views') || '[[0,1.6,4.2,0,0.45,0,50]]');
  window.shot = async (i) => {
    const [x, y, z, lx, ly, lz, fov] = views[i];
    camera.position.set(x, y, z); camera.fov = fov || 50; camera.updateProjectionMatrix();
    camera.lookAt(lx, ly, lz);
    renderer.render(scene, camera);
    await new Promise((r) => requestAnimationFrame(r));
    return true;
  };
  window.__VIEWS__ = views.length;
  info = { ok: true };
} catch (e) { info = { ok: false, error: String(e && e.stack || e) }; }
window.__INFO__ = info;
window.__DONE__ = true;
</script></body></html>
