<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "/game/vendor/three.module.js", "three/addons/": "/game/vendor/" } }</script>
<style>body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<script type="module">
// Load each candidate the way the game does (game/assetlib.js, hierarchy kept, surfaces on),
// check that userData.parts.glow survives on a fresh instance, and render the instances.
import * as THREE from 'three';
import { ASSET } from '/game/assetlib.js';
const names = new URLSearchParams(location.search).get('n').split(',');
const S = 420;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(S * names.length, S, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
renderer.setScissorTest(true);
const out = [];
for (let i = 0; i < names.length; i++) {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8fa36a);
  scene.fog = new THREE.FogExp2(0x8fa36a, 0.004);
  const sun = new THREE.DirectionalLight(0xffe2a0, 2.4);
  sun.position.set(-18, 40, -30);
  scene.add(sun, sun.target, new THREE.HemisphereLight(0xd8eab0, 0x2f3d1c, 1.15));
  const a = await ASSET(`/c/${names[i]}.js`, { keepHierarchy: true, surfaces: true });
  const b = await ASSET(`/c/${names[i]}.js`, { keepHierarchy: true, surfaces: true });
  const glow = a.userData.parts && a.userData.parts.glow;
  let meshes = 0, textured = 0;
  a.traverse((o) => { if (o.isMesh) { meshes++; if (o.material.map) textured++; } });
  const g2 = b.userData.parts && b.userData.parts.glow;
  out.push({ name: names[i], glow: !!(glow && glow.isMesh), emissive: glow ? glow.material.emissive.getHexString() : null,
    inTree: glow ? glow.parent !== null : false, distinct: !!(glow && g2 && glow !== g2), meshes, textured,
    size: a.userData.nativeSize ? ['x', 'y', 'z'].map((k) => +a.userData.nativeSize[k].toFixed(2)) : null });
  scene.add(a);
  const cam = new THREE.PerspectiveCamera(40, 1, 0.1, 1000);
  cam.position.set(0, 3, 105);
  cam.lookAt(0, 28, 0);
  renderer.setViewport(i * S, 0, S, S);
  renderer.setScissor(i * S, 0, S, S);
  renderer.render(scene, cam);
}
console.log(JSON.stringify(out));
window.__DONE__ = true;
</script>
</body>
</html>
