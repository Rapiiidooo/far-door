<!doctype html>
<html><head><meta charset="utf-8"><title>distance check</title>
<script type="importmap">{ "imports": { "three": "/game/vendor/three.module.js" } }</script>
<style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body><script type="module">
// Throwaway: the candidates in sun on sandstone, seen at game distances.
import * as THREE from 'three';
const q = new URLSearchParams(location.search);
const files = (q.get('files') || 'hero_explorer_a,hero_explorer_b,hero_explorer_c').split(',');
const dist = +(q.get('d') || 10), back = q.get('back') === '1', W = 1280, H = 720;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc9d6de);
scene.fog = new THREE.Fog(0xd8d2c4, 12, 90);
scene.add(new THREE.HemisphereLight(0xdfe9ff, 0xb08658, 1.3));
const sun = new THREE.DirectionalLight(0xfff0d8, 3.2);
sun.position.set(6, 12, 8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 40 });
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const block = new THREE.Mesh(new THREE.BoxGeometry(1.9, 1.9, 1.9), new THREE.MeshStandardMaterial({ color: 0xb57f4f, roughness: 0.9 }));
block.position.set(-3.6, 0.95, -1.5); block.castShadow = true; block.receiveShadow = true; scene.add(block);
const wall = new THREE.Mesh(new THREE.BoxGeometry(14, 5, 1), new THREE.MeshStandardMaterial({ color: 0xb57f4f, roughness: 0.9 }));
wall.position.set(0, 2.5, -6); wall.receiveShadow = true; scene.add(wall);
let x = -(files.length - 1) * 0.8;
for (const f of files) {
  const mod = await import(`../${f}.js?t=${Date.now()}`);
  const g = mod.default(THREE);
  g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  g.position.x = x; x += 1.6;
  if (back) g.rotation.y = Math.PI;
  scene.add(g);
}
const cam = new THREE.PerspectiveCamera(55, W / H, 0.1, 300);
cam.position.set(0, 2.6 + dist * 0.12, dist);
cam.lookAt(0, 1.0, 0);
renderer.render(scene, cam);
window.__DONE__ = true;
</script></body></html>
