<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>frozen falls in context</title>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
<style>body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<script type="module">
// Scratch only: the candidates against a frost-slate cliff under the frozen reach's light
// (values copied from game/world-four.js and the rig), with the game's ice gloss applied.
import * as THREE from 'three';
const q = new URLSearchParams(location.search);
const names = (q.get('c') || 'a,b,c').split(',');
const W = +(q.get('w') || 1500), H = +(q.get('h') || 700);
const cam = (q.get('cam') || '0,4,30,0,4.5,0').split(',').map(Number);
const fov = +(q.get('fov') || 40);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.86;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb2cc);
scene.fog = new THREE.FogExp2(0xaebfd4, 0.0085);
const SUN = new THREE.Vector3(-0.66, 0.32, 0.35).normalize();
const sun = new THREE.DirectionalLight(0xffd9c2, 3.1);
sun.position.copy(SUN).multiplyScalar(80);
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xc4d8f0, 0x6d7a90, 1.75));
const env = new THREE.Scene();
env.background = new THREE.Color(0x9fb2cc);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(env, 0.04).texture;

const slate = new THREE.MeshStandardMaterial({ color: 0x3d4654, roughness: 0.9, flatShading: true });
const snow = new THREE.MeshStandardMaterial({ color: 0xe9f2f6, roughness: 0.85 });
const cliff = new THREE.Mesh(new THREE.BoxGeometry(60, 8.3, 8, 30, 6, 1), slate);
{ // a rough face, so the ice is seen against rock and not a wall
  const p = cliff.geometry.attributes.position;
  for (let i = 0; i < p.count; i++) if (p.getZ(i) > 0) {
    const x = p.getX(i), y = p.getY(i);
    if (Math.abs(y) < 4.1) p.setZ(i, 4 + 0.35 * Math.sin(x * 1.7 + y * 2.3) * Math.cos(x * 0.6 - y));
  }
  cliff.geometry.computeVertexNormals();
}
cliff.position.set(0, 4.15, -4);
scene.add(cliff);
const cap = new THREE.Mesh(new THREE.BoxGeometry(60, 0.3, 8), snow);
cap.position.set(0, 8.4, -4);
scene.add(cap);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), snow);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// the game's iceLook: gloss on anything icy
const iceLook = (o) => o.traverse((m) => {
  if (!m.isMesh) return;
  const hsl = m.material.color.getHSL({});
  if (hsl.h > 0.45 && hsl.h < 0.65 && hsl.s > 0.2) {
    m.material = m.material.clone();
    m.material.roughness = 0.1; m.material.metalness = 0.15; m.material.envMapIntensity = 1.3;
  }
});

const gap = 8;
for (let i = 0; i < names.length; i++) {
  const mod = await import(`../frozen_falls_${names[i]}.js?${Date.now()}`);
  const o = mod.default(THREE);
  iceLook(o);
  const box = new THREE.Box3().setFromObject(o);
  o.position.set((i - (names.length - 1) / 2) * gap, 0, -box.min.z + 0.01);
  scene.add(o);
}
const camera = new THREE.PerspectiveCamera(fov, W / H, 0.1, 500);
camera.position.set(cam[0], cam[1], cam[2]);
camera.lookAt(cam[3], cam[4], cam[5]);
renderer.render(scene, camera);
window.__DONE__ = true;
</script>
</body>
</html>
