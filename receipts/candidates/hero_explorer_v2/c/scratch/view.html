<!doctype html>
<html><head><meta charset="utf-8"><title>pose views</title>
<script type="importmap">{ "imports": { "three": "/game/vendor/three.module.js" } }</script>
<style>body{margin:0;background:#22262b}canvas{display:block}</style></head>
<body><script type="module">
// Throwaway: load a candidate, pose its joints, render a grid of close views.
// ?src=<module url>&pose=<json {joint:[x,y,z]}>&views=<json [{az,el,d,t:[x,y,z],fov}]>&size=&cols=&sun=1
import * as THREE from 'three';
const q = new URLSearchParams(location.search);
const size = +(q.get('size') || 400), views = JSON.parse(q.get('views')), cols = +(q.get('cols') || views.length);
const rows = Math.ceil(views.length / cols);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(size * cols, size * rows, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const sunny = q.get('sun') === '1';
if (sunny) {
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  scene.background = new THREE.Color(0xc9d6de);
  scene.add(new THREE.HemisphereLight(0xdfe9ff, 0xb08658, 1.3));
  const sun = new THREE.DirectionalLight(0xfff0d8, 3.2); sun.position.set(6, 12, 8); scene.add(sun);
} else {
  scene.background = new THREE.Color(0x22262b);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x556677, 2.0));
  const sun = new THREE.DirectionalLight(0xffffff, 1.9); sun.position.set(5, 9, 7); scene.add(sun);
}
const out = { ok: false };
try {
  const mod = await import(q.get('src') + '?t=' + Date.now());
  const g = mod.default(THREE);
  const pose = JSON.parse(q.get('pose') || '{}');
  const J = g.userData.joints;
  for (const [k, r] of Object.entries(pose)) J[k].rotation.set(r[0] || 0, r[1] || 0, r[2] || 0);
  // re-ground after posing
  g.updateMatrixWorld(true);
  const b = new THREE.Box3(), w = new THREE.Vector3();
  g.traverse((n) => { const p = n.isMesh && n.geometry.attributes.position; if (!p) return;
    for (let i = 0; i < p.count; i++) b.expandByPoint(w.fromBufferAttribute(p, i).applyMatrix4(n.matrixWorld)); });
  g.position.y = -b.min.y;
  scene.add(g);
  g.updateMatrixWorld(true);
  views.forEach((vw, i) => {
    const t = new THREE.Vector3(...vw.t), az = vw.az * Math.PI / 180, el = vw.el * Math.PI / 180;
    const cam = new THREE.PerspectiveCamera(vw.fov || 30, 1, 0.01, 100);
    cam.position.set(t.x + Math.sin(az) * Math.cos(el) * vw.d, t.y + Math.sin(el) * vw.d, t.z + Math.cos(az) * Math.cos(el) * vw.d);
    cam.lookAt(t);
    const x = (i % cols) * size, y = (rows - 1 - Math.floor(i / cols)) * size;
    renderer.setViewport(x, y, size, size); renderer.setScissor(x, y, size, size); renderer.setScissorTest(true);
    renderer.render(scene, cam);
  });
  out.ok = true;
} catch (e) { out.error = String(e && e.stack || e); }
window.__OUT__ = out; window.__DONE__ = true;
</script></body></html>
