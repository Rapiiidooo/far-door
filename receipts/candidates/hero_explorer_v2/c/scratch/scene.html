<!doctype html>
<html><head><meta charset="utf-8"><title>distance check</title>
<script type="importmap">{ "imports": { "three": "/game/vendor/three.module.js" } }</script>
<style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body><script type="module">
// Throwaway: first-pass hero (odd slots) next to this candidate (even slots) in
// sun on sandstone, posed, seen from a game camera. ?d=<metres>&back=1&poses=a,b,c
import * as THREE from 'three';
const q = new URLSearchParams(location.search);
const dist = +(q.get('d') || 6), back = q.get('back') === '1', W = 1280, H = 720;
const POSES = {
  rest: {},
  run: { leftUpperLeg: [-1.0], leftLowerLeg: [1.2], rightUpperLeg: [0.6], rightLowerLeg: [0.3],
    leftUpperArm: [0.6], leftLowerArm: [-1.4], rightUpperArm: [-0.7], rightLowerArm: [-0.4] },
  hang: { leftUpperArm: [-2.9], rightUpperArm: [-2.9] },
  push: { leftUpperArm: [-1.4], rightUpperArm: [-1.4], leftLowerArm: [-0.5], rightLowerArm: [-0.5] },
  t: { leftUpperArm: [0, 0, 1.5], rightUpperArm: [0, 0, -1.5] },
};
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc9d6de);
scene.fog = new THREE.Fog(0xd8d2c4, 12, 90);
scene.add(new THREE.HemisphereLight(0xdfe9ff, 0xb08658, 1.3));
const sun = new THREE.DirectionalLight(0xfff0d8, 3.2);
sun.position.set(6, 12, 8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 40 });
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const wall = new THREE.Mesh(new THREE.BoxGeometry(20, 5, 1), new THREE.MeshStandardMaterial({ color: 0xb57f4f, roughness: 0.9 }));
wall.position.set(0, 2.5, -6); wall.receiveShadow = true; scene.add(wall);
const poses = (q.get('poses') || 'rest,run,hang').split(',');
const files = ['/game/assets/hero_explorer.js', q.get('src')];
const mods = await Promise.all(files.map((f) => import(f + '?t=' + Date.now())));
const n = poses.length * 2;
let x = -(n - 1) * 0.55;
for (const p of poses) {
  for (const mod of mods) {
    const g = mod.default(THREE);
    for (const [k, r] of Object.entries(POSES[p])) g.userData.joints[k].rotation.set(r[0] || 0, r[1] || 0, r[2] || 0);
    g.updateMatrixWorld(true);
    const b = new THREE.Box3(), v = new THREE.Vector3();
    g.traverse((o) => { if (!o.isMesh) return; o.castShadow = true; o.receiveShadow = true;
      const pa = o.geometry.attributes.position; for (let i = 0; i < pa.count; i++) b.expandByPoint(v.fromBufferAttribute(pa, i).applyMatrix4(o.matrixWorld)); });
    g.position.set(x, p === 'hang' ? 0.3 - b.min.y : -b.min.y, 0);
    if (back) g.rotation.y = Math.PI;
    scene.add(g);
    x += 1.1;
  }
}
const cam = new THREE.PerspectiveCamera(58, W / H, 0.1, 300);
cam.position.set(0, 1.6 + dist * 0.28, dist);
cam.lookAt(0, 1.0, 0);
renderer.render(scene, cam);
window.__DONE__ = true;
</script></body></html>
