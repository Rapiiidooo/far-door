<!doctype html>
<html><head><meta charset="utf-8"><title>loader check</title>
<script type="importmap">{ "imports": { "three": "/game/vendor/three.module.js", "three/addons/": "/game/vendor/" } }</script>
</head><body><script type="module">
// Throwaway: load the candidate the way the game does (game/assetlib.js, keepHierarchy, height).
import * as THREE from 'three';
import { ASSET } from '/game/assetlib.js';
const url = new URLSearchParams(location.search).get('src');
const out = {};
for (const [k, opts] of [['tree', { keepHierarchy: true, height: 1.75, surfaces: false }], ['tree2', { keepHierarchy: true, height: 1.75, surfaces: false }]]) {
  const inst = await ASSET(url, opts);
  inst.updateMatrixWorld(true);
  const J = inst.userData.joints || {};
  const names = Object.keys(J);
  const alive = names.filter((n) => J[n] && J[n].isObject3D);
  // rotate one joint to prove it moves this instance only
  const before = J.leftHand.getWorldPosition(new THREE.Vector3());
  J.leftUpperArm.rotation.x = -2.9; inst.updateMatrixWorld(true);
  const after = J.leftHand.getWorldPosition(new THREE.Vector3());
  J.leftUpperArm.rotation.x = 0;
  const box = new THREE.Box3().setFromObject(inst);
  let meshes = 0; inst.traverse((o) => o.isMesh && meshes++);
  out[k] = { joints: names.length, resolved: alive.length, scale: inst.scale.x, grip: inst.userData.grip, palms: inst.userData.palms,
    handMovesY: +(after.y - before.y).toFixed(3), minY: +box.min.y.toFixed(4), maxY: +box.max.y.toFixed(4), meshes,
    innerOffset: inst.children[0].children[0] ? inst.children[0].position.toArray().map((x) => +x.toFixed(4)) : null };
}
window.__OUT__ = out; window.__DONE__ = true;
</script></body></html>
