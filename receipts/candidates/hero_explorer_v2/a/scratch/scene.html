<!doctype html>
<html><head><meta charset="utf-8"><title>game distance</title>
<script type="importmap">{ "imports": { "three": "/game/vendor/three.module.js" } }</script>
<style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body><script type="module">
// Throwaway: models in sun on sandstone at a game distance, recoloured like main.js does.
// ?files=a.js,b.js&d=6&az=0&pose=<json joint rotations>
import * as THREE from 'three';
const q = new URLSearchParams(location.search);
const files = q.get('files').split(','), dist = +(q.get('d') || 6), az = (+(q.get('az') || 0) * Math.PI) / 180;
const pose = JSON.parse(q.get('pose') || '{}');
const W = 1280, H = 720;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc9d6de);
scene.fog = new THREE.Fog(0xd8d2c4, 12, 90);
scene.add(new THREE.HemisphereLight(0xdfe9ff, 0xb08658, 1.3));
const sun = new THREE.DirectionalLight(0xfff0d8, 3.2);
sun.position.set(6, 12, 8); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 40 });
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const wall = new THREE.Mesh(new THREE.BoxGeometry(14, 5, 1), new THREE.MeshStandardMaterial({ color: 0xb57f4f, roughness: 0.9 }));
wall.position.set(0, 2.5, -6); wall.receiveShadow = true; scene.add(wall);
let x = -(files.length - 1) * 0.7;
for (const f of files) {
  const g = (await import(`${f}?t=${Date.now()}`)).default(THREE);
  for (const [k, r] of Object.entries(pose)) if (g.userData.joints[k]) g.userData.joints[k].rotation.set(r[0], r[1], r[2]);
  g.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    if (Math.abs(o.material.color.getHex() - 0xcdbf9f) < 0x030303) { o.material = o.material.clone(); o.material.color.setHex(0x9e8660); }
  });
  g.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(g);
  g.position.set(x, -b.min.y, 0); x += 1.4;
  g.rotation.y = az;
  scene.add(g);
}
const cam = new THREE.PerspectiveCamera(50, W / H, 0.1, 300);
cam.position.set(0, 1.9 + dist * 0.28, dist);
cam.lookAt(0, 1.0, 0);
renderer.render(scene, cam);
window.__DONE__ = true;
</script></body></html>
