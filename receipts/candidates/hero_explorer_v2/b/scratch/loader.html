<!doctype html>
<html><head><meta charset="utf-8"><title>loader check</title>
<script type="importmap">{ "imports": { "three": "/game/vendor/three.module.js", "three/addons/": "/game/vendor/" } }</script>
<style>body{margin:0}canvas{display:block}</style></head>
<body><script type="module">
// Throwaway: load the candidate through the game's loader as the game does (hierarchy kept, no surfaces),
// check the joints and plain data per instance, pose through the resolved references, mark the palms.
import * as THREE from 'three';
import { ASSET } from '/game/assetlib.js';
const out = { ok: false };
try {
  const url = '/receipts/candidates/hero_explorer_v2/b/hero_explorer_b.js';
  const a = await ASSET(url, { keepHierarchy: true, surfaces: false, height: 1.75 });
  const b = await ASSET(url, { keepHierarchy: true, surfaces: false, height: 1.75 });
  const J = a.userData.joints, JB = b.userData.joints;
  out.jointKeys = Object.keys(J || {});
  out.allGroups = Object.values(J || {}).every((j) => j && j.isGroup);
  out.handParents = [J.leftHand.parent === J.leftLowerArm, J.rightHand.parent === J.rightLowerArm];
  out.grip = a.userData.grip;
  out.palms = a.userData.palms;
  out.scale = a.scale.x;
  out.reorigin = a.children[0].position.toArray().map((c) => +c.toFixed(5));
  out.distinctInstances = J.head !== JB.head && J.leftHand !== JB.leftHand;
  // markers at the declared palm centres, before posing
  for (const p of Object.values(a.userData.palms)) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.012, 10, 8), new THREE.MeshBasicMaterial({ color: 0xff2020, depthTest: false }));
    m.position.fromArray(p); m.renderOrder = 9; a.add(m);
  }
  // b: hang, with the hands flexed through the loader's resolved references
  JB.leftUpperArm.rotation.x = -2.9; JB.rightUpperArm.rotation.x = -2.9;
  JB.leftHand.rotation.set(0.6, 0, 0.4); JB.rightHand.rotation.set(0.6, 0, -0.4);
  a.position.set(-0.6, 0, 0); b.position.set(0.6, 0, 0);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xc9d6de);
  scene.add(new THREE.HemisphereLight(0xdfe9ff, 0xb08658, 1.3));
  const sun = new THREE.DirectionalLight(0xfff0d8, 3.2); sun.position.set(6, 12, 8); scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.95 }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground, a, b);
  scene.updateMatrixWorld(true);
  const v = new THREE.Vector3(); let top = -Infinity, low = Infinity;
  b.traverse((n) => { const p = n.isMesh && n.geometry.attributes.position; if (!p) return;
    for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i).applyMatrix4(n.matrixWorld); top = Math.max(top, v.y); low = Math.min(low, v.y); } });
  out.hangTop = +top.toFixed(4); out.hangLow = +low.toFixed(4);
  let meshes = 0; a.traverse((n) => { if (n.isMesh && n.geometry.type !== 'SphereGeometry') meshes++; }); out.meshes = meshes;
  const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  r.setSize(900, 600, false); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
  document.body.appendChild(r.domElement);
  const cam = new THREE.PerspectiveCamera(40, 1.5, 0.1, 100); cam.position.set(1.6, 1.7, 3.6); cam.lookAt(0, 1.05, 0);
  r.render(scene, cam);
  out.ok = true;
} catch (e) { out.error = String(e && e.stack || e); }
window.__OUT__ = out; window.__DONE__ = true;
</script></body></html>
