<!doctype html>
<html><head><meta charset="utf-8"><title>distance check</title>
<script type="importmap">{ "imports": { "three": "/game/vendor/three.module.js" } }</script>
<style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body><script type="module">
// Throwaway: the in-game hero and the candidate in sun on sandstone, seen at game distances.
import * as THREE from 'three';
const q = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const W = 1280, H = 720;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc9d6de);
scene.fog = new THREE.Fog(0xd8d2c4, 12, 90);
scene.add(new THREE.HemisphereLight(0xdfe9ff, 0xb08658, 1.3));
const sun = new THREE.DirectionalLight(0xfff0d8, 3.2);
sun.position.set(6, 12, 8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 40 });
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const wall = new THREE.Mesh(new THREE.BoxGeometry(14, 5, 1), new THREE.MeshStandardMaterial({ color: 0xb57f4f, roughness: 0.9 }));
wall.position.set(0, 2.5, -6); wall.receiveShadow = true; scene.add(wall);
let x = -(q.files.length - 1) * 0.6;
for (const f of q.files) {
  const g = (await import(f + '?t=' + Date.now())).default(THREE);
  const J = g.userData.joints;
  for (const [k, r] of Object.entries(q.pose || {})) if (J[k]) J[k].rotation.set(r[0] || 0, r[1] || 0, r[2] || 0);
  // the game recolours pale canvas to a deeper khaki; do the same
  g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; const c = o.material.color; if (Math.abs(c.getHex() - 0xcdbf9f) < 0x030303) { o.material = o.material.clone(); o.material.color.setHex(0x9e8660); } } });
  g.position.x = x; x += 1.2;
  if (q.back) g.rotation.y = Math.PI;
  scene.add(g);
}
const cam = new THREE.PerspectiveCamera(55, W / H, 0.1, 300);
cam.position.set(0, 1.9 + q.d * 0.18, q.d);
cam.lookAt(0, 1.0, 0);
renderer.render(scene, cam);
window.__DONE__ = true;
</script></body></html>
