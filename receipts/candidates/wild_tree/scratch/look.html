<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "/three/three.module.js" } }</script>
<style>body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<script type="module">
// Scratch renderer: each candidate from eye height, at its base and from under the crown.
import * as THREE from 'three';
const q = new URLSearchParams(location.search);
const names = (q.get('n') || 'wild_tree_a,wild_tree_b,wild_tree_c').split(',');
const S = +(q.get('size') || 420);
const VIEWS = [
  { eye: [0, 1.7, 27], look: [0, 7.6, 0], fov: 48, sky: true },
  { eye: [23.4, 1.7, -13.5], look: [0, 7.6, 0], fov: 48, sky: true },
  { eye: [0, 3.2, 8.5], look: [0, 1.3, 0], fov: 50 },
  { eye: [5.5, 1.7, 7.5], look: [-0.5, 10.5, -1], fov: 70, sky: true },
];
if (q.get('view')) {
  VIEWS.length = 0;
  for (const v of q.get('view').split(';')) { const a = v.split(',').map(Number); VIEWS.push({ eye: a.slice(0, 3), look: a.slice(3, 6), fov: a[6], sky: true }); }
}
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(S * VIEWS.length, S * names.length, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
renderer.setScissorTest(true);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x556677, 2.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.9);
sun.position.set(5, 9, 7);
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 48).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x3b3326, roughness: 1 }));
scene.add(ground);
for (let r = 0; r < names.length; r++) {
  const mod = await import(`/c/${names[r]}.js?t=${Date.now()}`);
  const obj = mod.default(THREE);
  scene.add(obj);
  VIEWS.forEach((v, i) => {
    scene.background = new THREE.Color(v.sky ? 0x9fb3bf : 0x22262b);
    const cam = new THREE.PerspectiveCamera(v.fov, 1, 0.1, 200);
    cam.position.set(...v.eye);
    cam.lookAt(...v.look);
    const y = (names.length - 1 - r) * S;
    renderer.setViewport(i * S, y, S, S);
    renderer.setScissor(i * S, y, S, S);
    renderer.render(scene, cam);
  });
  scene.remove(obj);
}
window.__DONE__ = true;
</script>
</body>
</html>
