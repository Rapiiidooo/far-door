<!doctype html>
<html><head><meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "/game/vendor/three.module.js", "three/addons/": "/game/vendor/" } }</script>
<style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<script type="module">
// Throwaway: rope candidates hung from a sandstone ledge by their own userData.anchor, in the
// game's rig (same options as game/main.js), loaded through the game's assetlib with
// surfaces on, hero for scale.
import * as THREE from 'three';
import { createRig } from '/game/rig.js';
import { ASSET } from '/game/assetlib.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1280), H = +(q.get('h') || 720);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, W / H, 0.1, 900);
let info = { ok: false };
try {
  const rig = createRig(THREE, renderer, scene, {
    hour: +(q.get('hour') || 15.2), azimuth: +(q.get('az') || 236), maxElevation: 58, camera,
    fogStart: 60, fogDensity: 0.0032, exposure: 0.86,
  });
  await rig.ready;
  const stone = (hex) => { const m = new THREE.MeshStandardMaterial({ color: hex, roughness: 0.92 }); m.name = 'stone'; return m; };
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), stone(0xd4a373));
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);
  // the ledge: face on z = 0 looking +Z, top at LEDGE, a taller wall set back behind it
  const LEDGE = +(q.get('ledge') || 3);
  const ledge = new THREE.Mesh(new THREE.BoxGeometry(14, LEDGE, 4), [stone(0xb57f4f), stone(0xb57f4f), stone(0xd4a373), stone(0xb57f4f), stone(0xb57f4f), stone(0xb57f4f)]);
  ledge.position.set(0, LEDGE / 2, -2);
  scene.add(ledge);
  const back = new THREE.Mesh(new THREE.BoxGeometry(30, 12, 3), stone(0xb57f4f));
  back.position.set(0, 6, -9);
  scene.add(back);

  const hero = await ASSET('/game/assets/hero_explorer.js', { surfaces: false, keepHierarchy: true });
  const [hx, hz, hr] = (q.get('hero') || '1.3,1.2,0.4').split(',').map(Number);
  hero.position.set(hx, 0, hz); hero.rotation.y = hr;
  scene.add(hero);

  const srcs = (q.get('srcs') || '').split(',').filter(Boolean);
  const xs = (q.get('xs') || '-2.5,0,2.5').split(',').map(Number);
  const anchors = [];
  for (let i = 0; i < srcs.length; i++) {
    const mod = await import(srcs[i]);
    const anchor = mod.default(THREE).userData.anchor;
    const obj = await ASSET(srcs[i], { surfaces: q.get('surf') !== '0' });
    obj.position.set(xs[i] - anchor[0], LEDGE - anchor[1], 0 - anchor[2]);
    scene.add(obj);
    anchors.push(anchor);
  }
  scene.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  rig.refresh(scene);
  const views = JSON.parse(q.get('views') || '[[0,2,9,0,2.2,0,58]]');
  window.shot = async (i) => {
    const [x, y, z, lx, ly, lz, fov] = views[i];
    camera.position.set(x, y, z); camera.fov = fov || 58; camera.updateProjectionMatrix();
    camera.lookAt(lx, ly, lz);
    for (let k = 0; k < 4; k++) { rig.render(camera, 0.016); await new Promise((r) => requestAnimationFrame(r)); }
    return true;
  };
  window.__VIEWS__ = views.length;
  info = { ok: true, anchors };
} catch (e) { info = { ok: false, error: String(e && e.stack || e) }; }
window.__INFO__ = info;
window.__DONE__ = true;
</script></body></html>
